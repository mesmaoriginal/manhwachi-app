<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>پنل وبلاگ مانهواچی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--s1:#151515;--s2:#1f1f1f;--bd:#2c2c2c;--tx:#e8e8e8;--mu:#8c8c8c;--pr:#dc2626}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.9 Vazirmatn,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:7px 12px;width:100%}
input:focus,select:focus,textarea:focus,.ed:focus{outline:2px solid #dc262666;outline-offset:1px}
.btn{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:6px 14px;cursor:pointer;display:inline-block;white-space:nowrap}
a.btn{color:var(--tx);text-decoration:none}.btn:hover{border-color:#555}.btn.p{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:700}
.wrap{max-width:860px;margin:0 auto;padding:16px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.mu{color:var(--mu);font-size:13px}.err{color:#f87171}
.top{position:sticky;top:0;z-index:30;background:#0b0b0bee;backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.tb{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:6px 16px;max-width:860px;margin:0 auto}
.tb button,.tb select,.tb label{width:auto;padding:2px 9px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);cursor:pointer;line-height:1.7}
.tb input[type=color]{width:28px;height:28px;padding:0;border:0;background:none;cursor:pointer}
.tag{font-size:12px;border-radius:99px;padding:1px 10px;background:#333}.tag.published{background:#14532d}.tag.review{background:#713f12}.tag.archived{background:#444}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:right}tr.r{cursor:pointer}tr.r:hover{background:var(--s2)}
.title{font-size:28px;font-weight:700;border:0;background:none;padding:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--bd);border-radius:99px;padding:2px 12px;cursor:pointer;background:var(--s2)}.chip.on{background:var(--pr);border-color:var(--pr);color:#fff}
.cv{position:relative;border-radius:14px;overflow:hidden;background:var(--s2) center/cover;min-height:150px;margin:8px 0;display:flex;align-items:flex-end}
.cv span{position:relative;padding:12px 16px;font-weight:700;font-size:20px}
.cv[data-s=overlay]{min-height:240px}.cv[data-s=overlay]::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,#000c)}.cv[data-s=overlay] span{z-index:1}
.cv[data-s=full]{min-height:200px;align-items:flex-start}.cv[data-s=compact]{min-height:90px;width:60%}.cv[data-s=split]{width:50%;min-height:170px}.cv[data-s=none]{display:none}
.blk{position:relative;margin:6px 0;padding:6px 10px;border-radius:12px;border:1px solid transparent}.blk:hover,.blk:focus-within{border-color:var(--bd);background:#ffffff05}
.bh{display:flex;visibility:hidden;justify-content:space-between;font-size:12px;color:var(--mu)}.blk:hover .bh,.blk:focus-within .bh{visibility:visible}
.bc button{background:none;border:0;color:var(--mu);cursor:pointer;padding:0 6px}.bc button:hover{color:#fff}
.ed{min-height:1.9em;outline:0;padding:2px 4px;border-radius:6px;word-break:break-word}.ed:empty::before{content:attr(data-ph);color:#555}
.blk[data-al=center] .ed{text-align:center}.blk[data-al=left] .ed{text-align:left}.blk[data-al=justify] .ed{text-align:justify}
.blk[data-t=heading] .ed{font-weight:700;font-size:1.6rem}.blk[data-t=heading][data-level="3"] .ed{font-size:1.3rem}.blk[data-t=heading][data-level="4"] .ed{font-size:1.1rem}
.blk[data-t=quote] .ed{border-right:4px solid var(--pr);padding-right:14px;color:#ccc;font-size:1.1rem}
.blk[data-t=callout] .ed{border-radius:10px;padding:10px 14px;background:#1e3a5f55}.blk[data-t=callout][data-tone=warn] .ed{background:#78350f55}.blk[data-t=callout][data-tone=success] .ed{background:#14532d55}.blk[data-t=callout][data-tone=danger] .ed{background:#7f1d1d55}
.blk code{background:#333;border-radius:4px;padding:0 5px;font-family:monospace}.blk a{color:#60a5fa}
ul.ed,ol.ed{padding-right:28px}
.blk img.pv{max-width:100%;border-radius:10px;display:block;margin:6px auto}.blk[data-width=sm] img.pv{max-width:30%}.blk[data-width=md] img.pv{max-width:60%}
.blk[data-al=right] img.pv{margin-right:0}.blk[data-al=left] img.pv{margin-left:0}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-top:6px}
.menu{position:absolute;z-index:40;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;box-shadow:0 10px 40px #000}
.menu button{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;cursor:pointer}.menu button:hover{border-color:var(--pr)}
.res{background:var(--s2);border-radius:10px;margin-top:4px}.res button{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;padding:4px 8px;cursor:pointer;text-align:right}.res button:hover{background:#333}.res img,.mc img{width:36px;height:50px;object-fit:cover;border-radius:4px}
.mc{display:flex;gap:10px;align-items:center;margin-top:6px}
.modal{position:fixed;inset:0;background:#000b;z-index:60;display:flex;align-items:center;justify-content:center}.mbox{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:16px;width:min(760px,94vw);max-height:86vh;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}.grid img{width:100%;height:90px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}.grid img:hover{border-color:var(--pr)}
.blk[data-t=image].noalt{border-color:#f87171}
.sr{display:grid;gap:4px;margin-top:10px}.sr div{font-size:13px;line-height:1.7}.sr .b{color:#f87171}.sr .w{color:#fbbf24}.sr .g{color:#4ade80}
.cnt{float:left;font-size:12px}.cnt.ok{color:#4ade80}.cnt.w{color:#fbbf24}
#toast{position:fixed;bottom:16px;left:16px;background:#222;border:1px solid var(--bd);border-radius:10px;padding:8px 16px;z-index:99;display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.stat{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:8px 12px}.stat b{display:block;font-size:22px;line-height:1.5}.stat span{color:var(--mu);font-size:12px}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:12px}.dl h4{margin:0 0 4px;font-size:13px;color:var(--mu)}.dl a{display:flex;justify-content:space-between;gap:8px;color:var(--tx);text-decoration:none;font-size:13px;padding:2px 0}.dl a:hover{color:#fff}
.banner{position:sticky;top:0;z-index:90;background:#7f1d1d;color:#fff;padding:8px 16px;text-align:center;font-size:14px}
.ic{background:none;border:0;color:var(--mu);cursor:pointer;padding:0 6px;white-space:nowrap}.ic:hover{color:#fff}
.tbl2 td{vertical-align:middle}.tbl2 input,.tbl2 select{padding:3px 8px}
.chk{display:flex;gap:6px;align-items:center;width:auto}.chk input{width:auto}
.cd{font-family:ui-monospace,monospace;direction:ltr;text-align:left;font-size:13px}
.tbg td{padding:3px}.tbg input{min-width:80px}
.fq{border:1px solid var(--bd);border-radius:10px;padding:8px;margin:6px 0}
.hist{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.kw{margin-top:10px;border-top:1px solid var(--bd);padding-top:8px}.kw div{font-size:13px;line-height:1.7}
.tag.sch{background:#1e3a8a}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=$('#app');let me=null,cur=null,dirtyF=false,cats=[];
const can=p=>me&&me.permissions.includes(p);
function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.display='block';t.style.borderColor=bad?'#f87171':'#2c2c2c';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',bad?7000:3200)}
async function api(m,p,body,form){
  const h={'X-Blog-Panel':'1'};if(body&&!form)h['Content-Type']='application/json';
  const r=await fetch('/panel/api'+p,{method:m,headers:h,credentials:'same-origin',body:form||(body?JSON.stringify(body):undefined)});
  const j=await r.json().catch(()=>({}));if(!r.ok){
    // نشست منقضی شد (۱۲ ساعت) یا حساب غیرفعال شد: به‌جای خطاهای پشت‌سرهم، برگرد به صفحه‌ی ورود
    if(r.status===401&&p!=='/login'&&me){me=null;clearInterval(cur?.auto);cur=null;dirtyF=false;loginView('نشست شما منقضی شد؛ دوباره وارد شوید')}
    const e=new Error(j.error||'خطا ('+r.status+')');e.status=r.status;throw e}return j}
/* باید دقیقاً با normSlug سمت سرور یکی باشد */
function slugify(s,auto){
  let o=String(s||'').normalize('NFKC').trim().toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک')
    .replace(/[\u06F0-\u06F9]/g,c=>String(c.charCodeAt(0)-0x06f0)).replace(/[\u0660-\u0669]/g,c=>String(c.charCodeAt(0)-0x0660))
    .replace(/\u0640/g,'').replace(/[\s_]+/g,'-').replace(/[^\p{L}\p{N}-]/gu,'').replace(/-+/g,'-').replace(/^-|-$/g,'');
  if(auto&&o.length>70){const c=o.slice(0,70),i=c.lastIndexOf('-');o=i>=30?c.slice(0,i):c}
  return o.slice(0,120).replace(/-+$/g,'')}
const fmtD=d=>d?new Date(d).toLocaleDateString('fa-IR'):'—';
const ST={draft:'پیش‌نویس',review:'در انتظار بررسی',published:'منتشرشده',archived:'بایگانی'};

/* ---------- متن غنی: DOM <-> runs ---------- */
const FN={vazir:'Vazirmatn',naskh:'Noto Naskh Arabic',kufi:'Noto Kufi Arabic',mono:'monospace'};
const ZEM={sm:'0.85em',lg:'1.25em',xl:'1.5em','2xl':'2em'};
const ZR={'x-small':'sm','small':'sm','0.85em':'sm','large':'lg','1.25em':'lg','x-large':'xl','1.5em':'xl','xx-large':'2xl','xxx-large':'2xl','2em':'2xl'};
function hex(c){const m=/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/.exec(c||'');if(m){if(m[4]!==undefined&&+m[4]===0)return'';return'#'+[1,2,3].map(i=>(+m[i]).toString(16).padStart(2,'0')).join('')}return/^#[0-9a-f]{6}$/i.test(c||'')?c.toLowerCase():''}
function toRuns(root){
  const out=[];
  (function w(n,st){
    if(n.nodeType===3){const t=n.nodeValue.replace(/\u200b/g,'');if(t)out.push({t,...st});return}
    if(n.nodeType!==1)return;const tg=n.nodeName;
    if(tg==='BR'){out.push({t:'\n',...st});return}
    const s={...st},y=n.style||{},td=y.textDecorationLine||y.textDecoration||'';
    if(tg==='B'||tg==='STRONG'||y.fontWeight==='bold'||+y.fontWeight>=600)s.b=1;
    if(tg==='I'||tg==='EM'||y.fontStyle==='italic')s.i=1;
    if(tg==='U'||td.includes('underline'))s.u=1;
    if(tg==='S'||tg==='STRIKE'||tg==='DEL'||td.includes('line-through'))s.s=1;
    if(tg==='CODE')s.code=1;
    if(tg==='A'&&n.getAttribute('href'))s.a={href:n.getAttribute('href')};
    const c=hex(y.color);if(c)s.c=c;const h=hex(y.backgroundColor);if(h)s.h=h;
    if(y.fontSize){const z=ZR[y.fontSize];if(z)s.z=z;else delete s.z}
    const ff=(y.fontFamily||'').replace(/["']/g,'').split(',')[0].trim();for(const k in FN)if(FN[k]===ff)s.f=k;
    if((tg==='DIV'||tg==='P')&&out.length&&!/\n$/.test(out[out.length-1].t))out.push({t:'\n'});
    n.childNodes.forEach(ch=>w(ch,s));
  })(root,{});
  const m=[];for(const r of out){const l=m[m.length-1];if(l&&JSON.stringify({...l,t:0})===JSON.stringify({...r,t:0}))l.t+=r.t;else m.push({...r})}
  while(m.length&&/^\n*$/.test(m[m.length-1].t))m.pop();
  if(m.length)m[m.length-1].t=m[m.length-1].t.replace(/\n+$/,'');
  return m;
}
function fromRuns(runs){return(runs||[]).map(r=>{
  let h=esc(r.t).replace(/\n/g,'<br>');const st=[];
  if(r.b)st.push('font-weight:bold');if(r.i)st.push('font-style:italic');
  const td=[r.u&&'underline',r.s&&'line-through'].filter(Boolean).join(' ');if(td)st.push('text-decoration:'+td);
  if(r.c)st.push('color:'+r.c);if(r.h)st.push('background-color:'+r.h);if(r.z)st.push('font-size:'+ZEM[r.z]);if(r.f)st.push('font-family:'+FN[r.f]);
  if(st.length)h=`<span style="${st.join(';')}">${h}</span>`;if(r.code)h=`<code>${h}</code>`;if(r.a)h=`<a href="${esc(r.a.href)}">${h}</a>`;return h}).join('')}

/* ---------- انتخاب متن و دستورات نوار ابزار ---------- */
let sel=null;const edOf=n=>n&&(n.nodeType===3?n.parentNode:n).closest?.('.ed');
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&edOf(s.anchorNode))sel=s.getRangeAt(0).cloneRange()});
function restore(){if(!sel)return false;const e=edOf(sel.startContainer);if(!e||!e.isConnected)return false;e.focus();const s=getSelection();s.removeAllRanges();s.addRange(sel);return true}
function cmd(c,v){if(!restore())return;document.execCommand('styleWithCSS',false,true);document.execCommand(c,false,v);dirty()}
function normHref(u){u=u.trim();if(!u)return'';return/^(https?:\/\/|mailto:|\/(?!\/)|#)/i.test(u)?u:'https://'+u}
function doLink(){if(!restore())return;const u=normHref(prompt('آدرس لینک (برای حذف لینک، خالی بگذارید):','https://')||'');if(u&&u!=='https://')cmd('createLink',u);else cmd('unlink')}
function doCode(){if(!restore())return;const t=getSelection().toString();if(t)cmd('insertHTML','<code>'+esc(t)+'</code>')}
function setAlign(a){const b=sel&&edOf(sel.startContainer)?.closest('.blk');if(b){b.dataset.al=a;const i=$('[data-k=al]',b);if(i)i.value=a;dirty()}}
function dirty(){dirtyF=true;const s=$('#sv');
  if(s)s.textContent=cur&&cur.status==='published'?'تغییرات ذخیره‌نشده (ذخیره‌ی خودکار برای مطلب منتشرشده خاموش است)':'تغییرات ذخیره‌نشده';
  if($('#sr'))seoUpd()}
const TB=`<button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="underline"><u>U</u></button><button data-c="strikeThrough"><s>S</s></button>
<button data-f="link">🔗</button><button data-f="code">&lt;/&gt;</button>
<label title="رنگ متن">A<input type="color" id="fc" value="#ff4d4d"></label><label title="هایلایت">🖍<input type="color" id="hc" value="#facc15"></label>
<select id="fz"><option value="">اندازه</option><option value="2">کوچک</option><option value="3">معمولی</option><option value="4">بزرگ</option><option value="5">درشت</option><option value="6">خیلی درشت</option></select>
<select id="ff"><option value="">فونت</option>${Object.entries({'وزیرمتن':'Vazirmatn','نسخ':'Noto Naskh Arabic','کوفی':'Noto Kufi Arabic','مونو':'monospace'}).map(([a,b])=>`<option value="${b}">${a}</option>`).join('')}</select>
<button data-al="right">⇥</button><button data-al="center">≡</button><button data-al="left">⇤</button><button data-al="justify">☰</button>
<button data-c="removeFormat">پاک‌سازی</button><button data-c="undo">↶</button><button data-c="redo">↷</button>`;

/* ---------- بلوک‌ها ---------- */
const NAMES={paragraph:'پاراگراف',heading:'عنوان',list:'لیست',quote:'نقل‌قول',callout:'کادر',image:'تصویر',button:'دکمه',manhwa_card:'کارت مانهوا',video:'ویدیو',divider:'جداکننده',code:'کد',table:'جدول',faq:'سؤال‌های متداول'};
const MENU=[['paragraph','¶ پاراگراف'],['heading','H عنوان'],['list','• لیست'],['list:o','1. شماره‌دار'],['quote','❝ نقل‌قول'],['callout','ℹ کادر'],['image','🖼 تصویر'],['manhwa_card','📚 مانهوا'],['button','⏺ دکمه'],['video','▶ ویدیو'],['code','</> کد'],['table','▦ جدول'],['faq','؟ سؤال و جواب'],['divider','— جداکننده']];
const LANGS=[['','بدون زبان'],['js','JavaScript'],['ts','TypeScript'],['html','HTML'],['css','CSS'],['json','JSON'],['python','Python'],['php','PHP'],['sql','SQL'],['bash','Bash'],['java','Java'],['kotlin','Kotlin'],['xml','XML'],['yaml','YAML']];
const faqRow=it=>`<div class="fq"><input class="fq-q" placeholder="سؤال" value="${esc(it.q)}"><textarea class="fq-a" rows="2" placeholder="پاسخ" style="margin-top:4px">${esc(it.a)}</textarea><button class="ic" data-a="fq-">حذف این سؤال</button></div>`;
const opts=(a,sel)=>a.map(([v,l])=>`<option value="${v}"${v==sel?' selected':''}>${l}</option>`).join('');
function blk(t,d={}){
  const el=document.createElement('div');el.className='blk';el.dataset.t=t;
  el.dataset.al=d.al||(t==='image'||t==='button'?'center':'right');
  const ed=(h,c)=>`<div class="ed ${c||''}" contenteditable="true" data-ph="بنویسید…">${h}</div>`;let b='';
  if(t==='paragraph')b=ed(fromRuns(d.runs));
  if(t==='heading')b=`<select data-k="level" style="width:auto">${opts([[2,'عنوان بزرگ'],[3,'عنوان متوسط'],[4,'عنوان کوچک']],d.level||2)}</select>`+ed(fromRuns(d.runs));
  if(t==='list'){el.dataset.ord=d.ordered?'1':'';const tg=d.ordered?'ol':'ul';b=`<${tg} class="ed" contenteditable="true">${(d.items&&d.items.length?d.items:[[]]).map(i=>'<li>'+fromRuns(i)+'</li>').join('')}</${tg}>`}
  if(t==='quote')b=ed(fromRuns(d.runs))+`<input data-k="cite" placeholder="منبع (اختیاری)" value="${esc(d.cite)}">`;
  if(t==='callout')b=`<select data-k="tone" style="width:auto">${opts([['info','اطلاعات'],['warn','هشدار'],['success','موفقیت'],['danger','خطر']],d.tone)}</select>`+ed(fromRuns(d.runs));
  if(t==='image')b=`<img class="pv" ${d.src?`src="${esc(d.src)}"`:'hidden'}><div class="row"><button class="btn" data-a="pick">انتخاب / آپلود تصویر</button><input data-k="src" placeholder="یا آدرس تصویر" value="${esc(d.src)}" style="flex:1"></div>
    <div class="mini"><input data-k="alt" placeholder="متن جایگزین (alt)" value="${esc(d.alt)}"><input data-k="caption" placeholder="زیرنویس" value="${esc(d.caption)}"><select data-k="width">${opts([['sm','کوچک'],['md','متوسط'],['lg','بزرگ'],['full','تمام‌عرض']],d.width||'lg')}</select><select data-k="al">${opts([['right','راست'],['center','وسط'],['left','چپ']],el.dataset.al)}</select></div>`;
  if(t==='button')b=`<div class="mini"><input data-k="text" placeholder="متن دکمه" value="${esc(d.text)}"><input data-k="href" dir="ltr" placeholder="لینک" value="${esc(d.href)}"><select data-k="style">${opts([['solid','توپر'],['outline','خطی']],d.style)}</select><select data-k="al">${opts([['right','راست'],['center','وسط'],['left','چپ']],el.dataset.al)}</select></div>`;
  if(t==='manhwa_card')b=`<input data-k="slug" type="hidden" value="${esc(d.slug)}"><input data-s placeholder="جستجوی مانهوا (نام فارسی/انگلیسی)…"><div class="res"></div><div class="mc"></div><select data-k="style" style="width:auto;margin-top:6px">${opts([['card','کارت'],['banner','بنر']],d.style)}</select>`;

function counter(id,min,max){const i=$('#'+id),c=$('#'+id+'c');if(!i||!c)return;const n=len(i.value);c.textContent=n+' / '+max;c.className='cnt '+(n&&n>=min&&n<=max?'ok':n?'w':'')}
function seoReport(){
  const box=$('#sr');if(!box||!cur)return;const isP=cur.kind==='posts',bad=[],warn=[];
  const title=$('#ti').value,st=$('#st').value,sd=$('#sd').value,ex=isP?$('#ex').value:'',sl=$('#sl').value;
  counter('st',30,60);counter('sd',70,160);
  const blocks=$$('#bl>.blk');let words=0,h2=0,lastLv=1,jump=false,firstH=true,noAlt=0,hasText=false,bodyText='',paras=[],hs=[];
  for(const b of blocks){
    const t=b.dataset.t;
    if(['paragraph','list','quote','callout','heading'].includes(t)){const x=$$('.ed',b).map(e=>e.textContent).join(' ').trim();if(x){hasText=true;words+=x.split(/\s+/).filter(Boolean).length;bodyText+=' '+x;if(t==='paragraph')paras.push(x);if(t==='heading'&&+b.dataset.level<=3)hs.push(x)}}
    if(t==='faq'||t==='table'){const x=$$('input:not([type=checkbox]),textarea',b).map(i=>i.value).join(' ').trim();if(x){hasText=true;words+=x.split(/\s+/).filter(Boolean).length;bodyText+=' '+x}}
    if(t==='heading'&&$('.ed',b).textContent.trim()){const lv=+b.dataset.level||2;if(lv===2)h2++;if(firstH?lv>2:lv>lastLv+1)jump=true;firstH=false;lastLv=lv}
    if(t==='image'){const has=$('[data-k=src]',b).value.trim(),alt=!$('[data-k=alt]',b).value.trim();b.classList.toggle('noalt',!!has&&alt);if(has&&alt)noAlt++}
  }
  if(!title.trim())bad.push('عنوان خالی است');
  if(!sl.trim())bad.push('نشانک (آدرس) خالی است');
  if(!hasText)bad.push('هنوز هیچ متنی ننوشته‌اید');
  if(noAlt)bad.push(noAlt+' تصویر بدون متن جایگزین (alt) — کادر قرمز در ویرایشگر');
  if(isP&&cur.cover&&$('#cs .on')?.dataset.v!=='none'&&!$('#ca').value.trim())bad.push('کاور بدون متن جایگزین (alt)');
  if(isP&&!ex.trim()&&!sd.trim())bad.push('«خلاصه» یا «توضیح سئو» خالی است (توضیح متای گوگل)');
  const tl=len(st||title);if(tl>60)warn.push('عنوان سئو بلند است ('+tl+' کاراکتر)؛ گوگل بعد از حدود ۶۰ کاراکتر می‌برد');
  const dl=len(sd||ex);if(dl&&dl<70)warn.push('توضیح متا کوتاه است ('+dl+')؛ ۷۰ تا ۱۶۰ کاراکتر مناسب است');
  if(dl>160)warn.push('توضیح متا بلند است ('+dl+')؛ گوگل بعد از حدود ۱۶۰ کاراکتر می‌برد');
  if(sl.length>80)warn.push('آدرس طولانی است؛ آدرس کوتاه‌تر بهتر است');
  if(hasText&&words<300)warn.push('متن کوتاه است ('+words+' کلمه)؛ مطلب کم‌محتوا سخت‌تر رتبه می‌گیرد');
  if(words>=300&&!h2)warn.push('حداقل یک «عنوان بزرگ» (H2) برای ساختار مطلب اضافه کنید');

  box.innerHTML=(bad.length||warn.length)?bad.map(x=>'<div class="b">✕ '+esc(x)+'</div>').join('')+warn.map(x=>'<div class="w">⚠ '+esc(x)+'</div>').join(''):'<div class="g">✓ مشکلی در سئو دیده نشد</div>';
  const wc=$('#wc');if(wc)wc.textContent=words+' کلمه · '+Math.max(1,Math.round(words/180))+' دقیقه مطالعه';

    const k=N(fk),has=x=>N(x).includes(k),first=(paras[0]||'').split(/\s+/).slice(0,100).join(' ');

    box.innerHTML+='<div class="kw"><b>کلمه‌ی کلیدی «'+esc(fk)+'»</b>'+rows.map(([ok,g,w])=>ok?'<div class="g">✓ '+g+'</div>':'<div class="w">⚠ '+w+'</div>').join('')+(dens>3?'<div class="w">⚠ تراکم زیاد است ('+dens.toFixed(1)+'٪)؛ ممکن است اسپم به‌نظر برسد</div>':cnt?'<div class="g">✓ تراکم مناسب است ('+cnt+' بار در متن)</div>':'<div class="w">⚠ در متن نیامده</div>')+'</div>'}
  box.dataset.bad=bad.length}

  $('#b-hist').onclick=async()=>{if(!cur.id)return toast('ابتدا مطلب را یک‌بار ذخیره کنید',1);
    const m=openModal('<div class="row"><b class="grow">تاریخچه‌ی نسخه‌ها</b><button class="btn" data-x>بستن</button></div><p class="mu">نسخه‌ی قبل از هر تغییر مهم (حداکثر ۲۰ نسخه) نگهداری می‌شود. بازگردانی، وضعیت فعلی را هم در تاریخچه نگه می‌دارد.</p><div id="hl"><span class="mu">در حال بارگذاری…</span></div>');
    try{const l=await api('GET',`/${kind}/${cur.id}/revisions`);$('#hl',m).innerHTML=l.length?l.map(r=>`<div class="hist"><span class="grow">${esc(fmtDT(r.created_at))}${r.by?' — '+esc(r.by):''}<br><small class="mu">${esc(r.title)} · ${r.words} کلمه · ${r.blocks} بلوک</small></span><button class="btn" data-rv="${esc(r.id)}">بازگردانی</button></div>`).join(''):'<span class="mu">هنوز نسخه‌ای ذخیره نشده (بعد از اولین ویرایش‌های مهم اینجا پر می‌شود).</span>'}catch(e){$('#hl',m).textContent=e.message}
    m.addEventListener('click',async e=>{const id=e.target.dataset.rv;if(!id||!confirm('محتوای این نسخه جایگزین مطلب فعلی شود؟'))return;try{await api('POST',`/${kind}/${cur.id}/revisions/${id}/restore`);m.remove();dirtyF=false;toast('نسخه بازگردانی شد');const k2=kind,i2=cur.id;clearInterval(cur.auto);editorView(k2,i2)}catch(x){toast(x.message,1)}})};
  if(isP)api('GET','/tags').then(l=>{const box=$('#tgs');if(!box)return;box.innerHTML=l.slice(0,14).map(t=>`<span class="chip" data-tg="${esc(t.name)}">${esc(t.name)}</span>`).join('');box.onclick=e=>{const n=e.target.dataset.tg;if(!n)return;const cur2=$('#tg').value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);if(!cur2.includes(n))cur2.push(n);$('#tg').value=cur2.join('، ');dirty()}}).catch(()=>{});
  cur.save=save;cur.auto=setInterval(()=>{if(!cur||!document.getElementById('bl')){return}if(dirtyF&&cur.id&&cur.status!=='published')save(true)},45000);
}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'&&cur?.save&&$('#bl')){e.preventDefault();cur.save()}});
addEventListener('beforeunload',e=>{if(dirtyF){e.preventDefault();e.returnValue=''}});
function route(){clearInterval(cur?.auto);cur=null;const h=location.hash.split('/');
  if(h[1]==='new')editorView(h[2]==='pages'?'pages':'posts');else if(h[1]==='edit')editorView(h[2]==='pages'?'pages':'posts',h[3]);else listView()}
let lastHash=location.hash;
addEventListener('hashchange',()=>{
  if(dirtyF&&!confirm('تغییرات ذخیره‌نشده از بین می‌رود. ادامه می‌دهید؟')){history.replaceState(null,'',lastHash);return}
  lastHash=location.hash;dirtyF=false;route()});
async function boot(){try{me=await api('GET','/me');route()}catch(e){loginView()}}
boot();
</script>
</body>
</html>
