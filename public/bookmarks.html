<!DOCTYPE html>
<html class="dark" lang="fa" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="نشان‌شده‌های شما در مانهواچی.">
    <title>نشان‌شده‌ها | ManhwaChi</title>
    <link rel="icon" href="/ManhwaChi/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/ManhwaChi/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/ManhwaChi/apple-touch-icon.png" />
    <link rel="stylesheet" href="/mc-shared.css?v=1" />
    <meta name="theme-color" content="#000000" />
    <style>body{font-family:var(--mc-font);-webkit-font-smoothing:antialiased}</style>
    
    <link rel="stylesheet" href="/css/tailwind.css">
    <script>
      // اگر فایل کامپایل‌شده‌ی کامل Tailwind (با نشانه‌ی --mc-tw) نبود، مثل قبل از CDN لود می‌شود
      (function () {
        var ok = false;
        try { ok = !!getComputedStyle(document.documentElement).getPropertyValue('--mc-tw').trim(); } catch (e) {}
        window.__twLocal = ok;
        window.__twFallback = function (cb) {
          var s = document.createElement('script');
          s.src = 'https://cdn.tailwindcss.com?plugins=forms,container-queries';
          if (cb) s.onload = cb;
          document.head.appendChild(s);
        };
        
      })();
    </script>
    <link rel="stylesheet" href="/css/vendor/montserrat.css" onerror="this.onerror=null;this.media='print';this.onload=function(){this.media='all'};this.href='https://fonts.googleapis.com/css2?family=Montserrat:wght@400..800&amp;display=swap'">
    <link rel="stylesheet" href="/css/vendor/vazirmatn.css" onerror="this.onerror=null;this.media='print';this.onload=function(){this.media='all'};this.href='https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&amp;display=swap'">
    <link rel="stylesheet" href="/css/vendor/material-symbols.css" onerror="this.onerror=null;this.media='print';this.onload=function(){this.media='all'};this.href='https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block'">
    
    <script id="tailwind-config">
        if (!window.__twLocal) window.__twFallback(function () {
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#DC2626",
                        surface: "#000000",
                        "surface-elevated": "#161616",
                        "surface-container": "#1f1f1f",
                        "on-surface": "#e2e2e2",
                        "on-surface-variant": "#cbb8b8",
                        "text-muted": "#8C8C8C",
                    }
                }
            }
        }
    });
    </script>
<link rel="stylesheet" href="/mc-polish.css?v=1">
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="sticky top-0 z-50 w-full bg-surface/85 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-5 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <img src="/ManhwaChi/LOGO-main-white.webp" onerror="this.remove()" alt="ManhwaChi Logo" class="h-8 w-auto" />
                <span class="font-bold text-xl text-white font-['Montserrat']">Manhwa<span class="text-primary">Chi</span></span>
            </a>
            
            <!-- دکمه بازگشت (سمت چپ) -->
            <button onclick="history.back()" class="flex items-center justify-center w-10 h-10 rounded-xl bg-surface-elevated border border-white/10 text-on-surface hover:text-white hover:bg-white/10 transition" aria-label="بازگشت">
                <span class="material-symbols-outlined text-xl">arrow_left_alt</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-5 py-8 w-full flex-1">
        <h1 class="text-lg font-bold flex items-center gap-2">
                <span class="material-symbols-outlined text-primary">bookmark</span>
                لیست نشان‌شده‌ها
            </h1>
        <div id="bookmarksGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 mt-6">
            <!-- کارت‌های نشان شده در اینجا رندر می‌شوند -->
        </div>

        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
            <span class="material-symbols-outlined text-6xl text-text-muted mb-4">bookmark_border</span>
            <h2 class="text-xl font-bold mb-2">هیچ مانهوایی نشان‌گذاری نشده است</h2>
            <p class="text-text-muted text-sm mb-6">شما می‌توانید مانهواهای مورد علاقه خود را ذخیره کنید تا بعداً سریع‌تر دسترسی داشته باشید.</p>
            <a href="/library-page.html" class="px-6 py-3 bg-primary text-white rounded-2xl font-bold text-sm hover:opacity-90 transition">مشاهده آرشیو</a>
        </div>
    </main>

    <script>
        function renderBookmarks() {
            const grid = document.getElementById('bookmarksGrid');
            const emptyState = document.getElementById('emptyState');
            const bookmarks = JSON.parse(localStorage.getItem('manhwachi_bookmarks')) || [];

            if (bookmarks.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');
            grid.innerHTML = '';

            bookmarks.forEach(item => {
                const card = document.createElement('div');
                card.className = 'relative bg-surface-elevated rounded-2xl overflow-hidden border border-white/10 group';
                
                card.innerHTML = `
                    <a href="/comic/${encodeURIComponent(item.slug)}" class="block aspect-[3/4] relative overflow-hidden">
                        <img loading="lazy" decoding="async" src="${item.cover}" alt="${item.title_en}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                    </a>
                    <button onclick="removeBookmark('${item.slug}')" class="absolute top-2 left-2 w-9 h-9 rounded-xl bg-black/60 backdrop-blur-md text-white hover:text-primary flex items-center justify-center transition">
                        <span class="material-symbols-outlined text-xl">delete</span>
                    </button>
                    <div class="p-3">
                        <a href="/comic/${encodeURIComponent(item.slug)}" class="font-bold text-sm text-white line-clamp-1 hover:text-primary transition">${item.title_fa || item.title_en}</a>
                        <p class="text-xs text-text-muted font-['Montserrat'] mt-1 truncate">${item.title_en}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function removeBookmark(slug) {
            let bookmarks = JSON.parse(localStorage.getItem('manhwachi_bookmarks')) || [];
            bookmarks = bookmarks.filter(b => b.slug !== slug);
            localStorage.setItem('manhwachi_bookmarks', JSON.stringify(bookmarks));
            renderBookmarks();
        }

        window.onload = renderBookmarks;
    </script>
<script src="/mc-polish.js?v=1" defer></script>
</body>
</html>
