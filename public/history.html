<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>تاریخچه خواندن | مانهواچی</title>
  <link rel="icon" href="/ManhwaChi/favicon.ico" />
  <link rel="stylesheet" href="/css/vendor/vazirmatn.css" onerror="this.href='https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&display=swap'" />
  <link rel="stylesheet" href="/css/vendor/material-symbols.css" onerror="this.href='https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap'" />
  <link rel="stylesheet" href="/profile-pages.css?v=2" />
</head>
<body>
  <header class="pp-header">
    <div class="pp-header__inner">
      <a href="/" class="pp-brand">
        <img src="/ManhwaChi/LOGO-main-white.webp" alt="" onerror="this.remove()" />
        Manhwa<span class="accent">Chi</span>
      </a>
      <div class="pp-header__actions">
        <a href="/?page=profile" class="pp-icon-btn" title="پروفایل" aria-label="پروفایل">
          <span class="material-symbols-outlined">person</span>
        </a>
        <button type="button" class="pp-icon-btn" onclick="history.length > 1 ? history.back() : location.href='/'" title="بازگشت" aria-label="بازگشت">
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </div>
    </div>
  </header>

  <main class="pp-main">
    <nav class="pp-subnav" aria-label="بخش‌های پروفایل">
      <a href="/bookmarks.html">نشان‌شده‌ها</a>
      <a href="/history.html" class="is-on">تاریخچه</a>
      <a href="/my-comments.html">دیدگاه‌ها</a>
      <a href="/?page=profile">پروفایل</a>
    </nav>

    <div class="pp-title-row">
      <div>
        <h1 class="pp-title">
          <span class="material-symbols-outlined">history</span>
          تاریخچه خواندن
        </h1>
        <p class="pp-sub">آخرین چپترهایی که در این مرورگر باز کردی · همگام‌سازی بین دستگاه‌ها ندارد</p>
      </div>
      <div id="countBadge" class="pp-count hidden"><b id="countNum">0</b> مورد</div>
    </div>

    <div class="pp-toolbar">
      <div class="pp-search">
        <span class="material-symbols-outlined">search</span>
        <input type="search" id="searchInput" placeholder="جستجو در تاریخچه..." autocomplete="off" aria-label="جستجو" />
      </div>
      <button type="button" id="clearBtn" class="pp-btn pp-btn--danger">
        <span class="material-symbols-outlined" style="font-size:18px">delete_sweep</span>
        پاک کردن همه
      </button>
    </div>

    <div id="stateEmpty" class="pp-empty hidden">
      <span class="material-symbols-outlined">menu_book</span>
      <h2>تاریخچه خالی است</h2>
      <p>با خواندن چپترها، آخرین موقعیت‌ات اینجا ذخیره می‌شود.</p>
      <a href="/" class="pp-btn pp-btn--primary">شروع مطالعه</a>
    </div>
    <div id="grid" class="pp-grid"></div>
  </main>

  <div id="toasts" class="pp-toasts" aria-live="polite"></div>

  <script>
(function () {
  const KEY = 'manhwachi_reading_history';
  let items = [];

  function toast(msg, type) {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'pp-toast' + (type === 'ok' ? ' pp-toast--ok' : type === 'err' ? ' pp-toast--err' : '');
    el.textContent = msg;
    box.appendChild(el);
    requestAnimationFrame(() => el.classList.add('is-on'));
    setTimeout(() => {
      el.classList.remove('is-on');
      setTimeout(() => el.remove(), 250);
    }, 2600);
  }

  function escapeHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function loadRaw() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY));
      return Array.isArray(raw) ? raw : [];
    } catch (e) {
      return [];
    }
  }

  function saveRaw(list) {
    try {
      localStorage.setItem(KEY, JSON.stringify(list));
    } catch (e) {}
  }

  function fmtTime(ts) {
    if (!ts) return '';
    try {
      return new Date(ts).toLocaleDateString('fa-IR', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    } catch (e) {
      return '';
    }
  }

  function render() {
    const grid = document.getElementById('grid');
    const empty = document.getElementById('stateEmpty');
    const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    const filtered = !q
      ? items
      : items.filter((h) => {
          const t = ((h.title || '') + ' ' + (h.slug || '') + ' ' + (h.chapter_title || '')).toLowerCase();
          return t.includes(q);
        });

    document.getElementById('countNum').textContent = String(items.length);
    document.getElementById('countBadge').classList.toggle('hidden', items.length === 0);
    document.getElementById('clearBtn').style.display = items.length ? '' : 'none';

    if (!items.length) {
      empty.classList.remove('hidden');
      grid.classList.add('hidden');
      grid.innerHTML = '';
      return;
    }
    empty.classList.add('hidden');
    grid.classList.remove('hidden');

    if (!filtered.length) {
      grid.innerHTML = '<div class="pp-empty" style="grid-column:1/-1"><p>نتیجه‌ای برای این جستجو پیدا نشد.</p></div>';
      return;
    }

    grid.innerHTML = filtered
      .map((h) => {
        const title = h.title || h.slug;
        const cover = (c => c.indexOf('/manhwas/') === 0 ? (window.IMG_BASE || '') + c : c)(h.cover || '');
        const href = h.url || 'https://manhwachi.ir/comic/' + encodeURIComponent(h.slug);
        const ch =
          h.chapter_number != null && h.chapter_number !== ''
            ? 'چپتر ' + h.chapter_number + (h.chapter_title ? ' · ' + h.chapter_title : '')
            : h.chapter_title || '';
        const when = fmtTime(h.timestamp);
        return (
          '<article class="pp-card" data-slug="' +
          escapeHtml(h.slug) +
          '">' +
          '<button type="button" class="pp-card__remove" data-remove="' +
          escapeHtml(h.slug) +
          '" title="حذف" aria-label="حذف"><span class="material-symbols-outlined">close</span></button>' +
          '<a class="pp-card__cover" href="' +
          href +
          '">' +
          (cover
            ? '<img loading="lazy" decoding="async" src="' + escapeHtml(cover) + '" alt="' + escapeHtml(title) + '" />'
            : '') +
          '</a>' +
          '<div class="pp-card__body">' +
          '<a href="' +
          href +
          '"><h3 class="pp-card__title">' +
          escapeHtml(title) +
          '</h3></a>' +
          (ch ? '<p class="pp-card__meta">' + escapeHtml(ch) + '</p>' : '') +
          (when ? '<p class="pp-card__meta">' + escapeHtml(when) + '</p>' : '') +
          '</div></article>'
        );
      })
      .join('');

    grid.querySelectorAll('[data-remove]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const slug = btn.getAttribute('data-remove');
        items = items.filter((x) => x.slug !== slug);
        saveRaw(items);
        render();
        toast('از تاریخچه حذف شد', 'ok');
      });
    });
  }

  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!items.length) return;
    if (!confirm('همه تاریخچه خواندن این مرورگر پاک شود؟')) return;
    items = [];
    try {
      localStorage.removeItem(KEY);
    } catch (e) {}
    render();
    toast('تاریخچه پاک شد', 'ok');
  });

  items = loadRaw().sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
  render();
})();
  </script>
</body>
</html>
