<!DOCTYPE html>
<html class="dark" dir="rtl" lang="fa">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>جستجوی مانهواچی | ManhwaChi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <style>
        body {
            background-color: #0b0b0e;
            color: #e2e2e2;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .glass-card {
            background: rgba(22, 22, 29, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-input {
            background: rgba(28, 28, 36, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-glow:focus-within {
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.25);
            border-color: #dc2626;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 99px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #dc2626;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .card-image-hover {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .group:hover .card-image-hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-8">

<!-- Main Search Container -->
<main class="w-full max-w-5xl mx-auto py-4">
    
    <!-- Search Bar & Input Section -->
    <section class="mb-8 relative">
        <div class="relative w-full max-w-3xl mx-auto search-glow rounded-2xl transition-all duration-300">
            <!-- Search Icon -->
            <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-zinc-400 group-focus-within:text-red-500 transition-colors">
                <span class="material-symbols-outlined text-2xl">search</span>
            </div>
            
            <input 
                class="glass-input w-full rounded-2xl py-4 pr-12 pl-12 focus:outline-none transition-all duration-300 font-medium text-zinc-100 placeholder-zinc-500 shadow-2xl text-base sm:text-lg" 
                id="main-search" 
                placeholder="عنوان مانهوا، مانگا یا کلمات کلیدی را بنویسید..." 
                type="text"
                autocomplete="off"
            />
            
            <!-- Clear Button -->
            <button class="absolute inset-y-0 left-4 flex items-center text-zinc-400 hover:text-red-500 transition-colors opacity-80 hover:opacity-100" id="clear-search" title="پاک‌کردن">
                <span class="material-symbols-outlined text-xl">close</span>
            </button>
        </div>
    </section>

    <!-- Controls & Filters Section -->
    <section class="mb-8 flex flex-col sm:flex-row items-center justify-between gap-4">
        
        <div id="filter-bar" class="w-full flex flex-wrap items-center justify-between sm:justify-start gap-3 glass-card p-2 rounded-2xl">
            
            <!-- Toggle Filter Button -->
            <button id="filter-toggle" class="flex items-center gap-2 font-medium text-sm text-zinc-300 hover:text-white px-4 py-2.5 rounded-xl bg-zinc-800/80 hover:bg-zinc-700/80 transition-all border border-zinc-700/50 active:scale-95">
                <span class="material-symbols-outlined text-lg text-red-500">tune</span>
                <span>فیلترهای پیشرفته</span>
            </button>

            <!-- Custom Select Dropdowns -->
            <div id="filter-options" class="hidden flex flex-wrap items-center gap-3 transition-all duration-300 w-full sm:w-auto mt-2 sm:mt-0">
                
                <div class="relative flex-1 sm:flex-initial">
                    <select id="type-filter" class="w-full appearance-none bg-zinc-900 text-zinc-300 rounded-xl pr-4 pl-9 py-2 text-sm border border-zinc-700/80 focus:border-red-500 focus:outline-none cursor-pointer font-medium hover:bg-zinc-800 transition-colors">
                        <option value="">همه انواع</option>
                        <option value="manhwa">مانهوا (Manhwa)</option>
                        <option value="manhua">مانها (Manhua)</option>
                        <option value="manga">مانگا (Manga)</option>
                    </select>
                    <span class="material-symbols-outlined text-zinc-400 text-sm absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none">expand_more</span>
                </div>

                <div class="relative flex-1 sm:flex-initial">
                    <select id="genre-filter" class="w-full appearance-none bg-zinc-900 text-zinc-300 rounded-xl pr-4 pl-9 py-2 text-sm border border-zinc-700/80 focus:border-red-500 focus:outline-none cursor-pointer font-medium hover:bg-zinc-800 transition-colors">
                        <option value="">همه ژانرها</option>
                        <option value="Action">اکشن</option>
                        <option value="Fantasy">فانتزی</option>
                        <option value="Romance">عاشقانه</option>
                        <option value="Drama">درام</option>
                        <option value="Adventure">ماجراجویی</option>
                    </select>
                    <span class="material-symbols-outlined text-zinc-400 text-sm absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none">expand_more</span>
                </div>

            </div>
            
        </div>

    </section>

    <!-- Default State: Search History -->
    <div id="default-state" class="w-full">
        <section class="mb-8 animate-fade-in">
            <div class="flex justify-between items-center mb-4 px-1">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-red-500 text-xl">history</span>
                    <h2 class="text-base font-bold text-zinc-200">جستجوهای اخیر شما</h2>
                </div>
                <button id="clear-history" class="text-xs text-zinc-400 hover:text-red-400 font-medium transition-colors flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">delete</span>
                    پاک‌کردن تاریخچه
                </button>
            </div>
            <div id="recent-searches" class="flex flex-wrap gap-2.5">
                <!-- Items dynamic injection -->
            </div>
        </section>
    </div>

    <!-- Results Display State -->
    <div class="hidden animate-fade-in pb-12 w-full" id="results-state">
        <div class="flex items-center justify-between mb-6 px-1">
            <h2 class="text-lg font-bold text-zinc-100 flex items-center gap-2">
                <span class="material-symbols-outlined text-red-500">grid_view</span>
                نتایج یافت‌شده
            </h2>
        </div>
        
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 lg:gap-5">
            <!-- Results will be injected dynamically -->
        </div>
    </div>

    <!-- Empty State -->
    <div class="hidden flex-col items-center justify-center py-16 text-center animate-fade-in glass-card rounded-3xl p-8" id="empty-state">
        <div class="w-20 h-20 mb-4 flex items-center justify-center bg-zinc-800/80 text-zinc-500 rounded-full border border-zinc-700/50 shadow-inner">
            <span class="material-symbols-outlined text-4xl text-red-500/80">search_off</span>
        </div>
        <h3 class="text-lg font-bold text-zinc-100">نتیجه‌ای یافت نشد!</h3>
        <p class="text-xs sm:text-sm text-zinc-400 max-w-xs mt-2 leading-relaxed">کلمه دیگری را بگردید یا فیلترهای انتخابی را بازنشانی کنید.</p>
        <button class="mt-6 px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white font-medium text-xs sm:text-sm rounded-xl transition-all shadow-lg shadow-red-600/30 active:scale-95 flex items-center gap-2" onclick="resetSearch()">
            <span class="material-symbols-outlined text-base">refresh</span>
            پاکسازی فیلترها
        </button>
    </div>

</main>    

<script>
    let itemsList = [];

    // DOM Elements
    const searchInput = document.getElementById('main-search');
    const clearBtn = document.getElementById('clear-search');
    const defaultState = document.getElementById('default-state');
    const resultsState = document.getElementById('results-state');
    const emptyState = document.getElementById('empty-state');
    const resultsGrid = resultsState.querySelector('.grid');
    const typeFilter = document.getElementById('type-filter');
    const genreFilter = document.getElementById('genre-filter');
    const filterToggle = document.getElementById('filter-toggle');
    const filterOptions = document.getElementById('filter-options');
    const filterBar = document.getElementById('filter-bar');
    const recentContainer = document.getElementById("recent-searches");
    const clearHistoryBtn = document.getElementById("clear-history");

    async function loadData() {
        try {
            const response = await fetch('/data/data.json'); 
            if (!response.ok) throw new Error('فایل اطلاعات یافت نشد.');
            const manhwaData = await response.json();
            
            itemsList = Object.keys(manhwaData).map(slug => ({
                slug: slug,
                ...manhwaData[slug]
            }));
        } catch (error) {
            console.error('بروز خطا در دریافت اطلاعات:', error);
        }
    }

    function normalizeText(text) {
        if (!text) return '';
        return text.toLowerCase()
            .replace(/ي/g, 'ی')
            .replace(/ك/g, 'ک')
            .replace(/‌/g, ' ') 
            .trim();
    }

    // Toggle Filters menu
    filterToggle.addEventListener('click', () => {
        filterOptions.classList.toggle('hidden');
    });

    function showDefaultState() {
        defaultState.classList.remove('hidden');
        resultsState.classList.add('hidden');
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
    }

    function showEmptyState() {
        defaultState.classList.add('hidden');
        resultsState.classList.add('hidden');
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
    }

    function showResultsState() {
        defaultState.classList.add('hidden');
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
        resultsState.classList.remove('hidden');
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // --- Search History Manager ---
    const HISTORY_KEY = "recentSearches";

    function getHistory() {
        return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    }

    function saveHistory(history) {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    }

    function addToHistory(text) {
        text = text.trim();
        const stopWords = ["مانهوا", "مانگا", "مانها", "manhwa", "manga", "manhua"];
        if (text.length < 2 || stopWords.includes(text.toLowerCase())) return;

        let history = getHistory();
        history = history.filter(x => x !== text);
        history.unshift(text);
        history = history.slice(0, 6);
        saveHistory(history);
        renderHistory();
    }

    function renderHistory() {
        const history = getHistory();
        recentContainer.innerHTML = "";
        
        if (history.length === 0) {
            defaultState.classList.add('hidden');
            return;
        } else if (searchInput.value === "") {
            defaultState.classList.remove('hidden');
        }

        history.forEach(item => {
            recentContainer.insertAdjacentHTML(
                "beforeend",
                `
                <div class="flex items-center gap-2 bg-zinc-800/80 hover:bg-red-500/10 border border-zinc-700/50 hover:border-red-500/40 px-3.5 py-1.5 rounded-xl group transition-all duration-300 cursor-pointer recent-pill-wrapper" data-value="${escapeHtml(item)}">
                    <span class="text-xs font-medium text-zinc-300 group-hover:text-white transition-colors">
                        ${escapeHtml(item)}
                    </span>
                    <button class="material-symbols-outlined text-sm text-zinc-400 hover:text-red-500 transition-colors remove-history" data-value="${escapeHtml(item)}">
                        close
                    </button>
                </div>
                `
            );
        });
    }

    recentContainer.addEventListener("click", e => {
        const wrapper = e.target.closest('.recent-pill-wrapper');
        if (!wrapper) return;

        const value = wrapper.dataset.value;

        if (e.target.classList.contains("remove-history")) {
            e.stopPropagation(); 
            let history = getHistory();
            history = history.filter(x => x !== value);
            saveHistory(history);
            renderHistory();
            
            if (searchInput.value === value) {
                searchInput.value = '';
                showDefaultState();
            }
            return;
        }

        searchInput.value = value;
        performSearch();
    });

    clearHistoryBtn.addEventListener("click", () => {
        localStorage.removeItem(HISTORY_KEY);
        renderHistory();
        searchInput.value = '';
        showDefaultState();
    });

    // --- Search Engine Algorithm ---
    function performSearch() {
        const rawQuery = searchInput.value;
        const query = normalizeText(rawQuery);
        const selectedType = typeFilter.value.toLowerCase();
        const selectedGenre = genreFilter.value.toLowerCase();

        if (query === "" && selectedType === "" && selectedGenre === "") {
            showDefaultState();
            return;
        }

        const stopWords = ["مانهوا", "مانگا", "مانها", "manhwa", "manga", "manhua"];
        const isQueryTooShort = query.length < 2;
        const isStopWord = stopWords.includes(query);
        const shouldIgnoreQuery = isQueryTooShort || isStopWord;

        if (shouldIgnoreQuery && selectedType === "" && selectedGenre === "") {
            showDefaultState();
            return;
        }

        const scoredItems = [];

        itemsList.forEach(item => {
            let score = 0;
            
            if (selectedType) {
                const typeMap = { 'manhwa': 'مانهوا', 'manga': 'مانگا', 'manhua': 'مانها' };
                const typeInFa = typeMap[selectedType] || selectedType;
                if (item.type && item.type.toLowerCase() !== typeInFa) return; 
            }

            if (selectedGenre) {
                const genreMap = {
                    'action': 'اکشن', 'fantasy': 'فانتزی', 'romance': 'عاشقانه', 
                    'drama': 'درام', 'adventure': 'ماجراجویی', 'comedy': 'کمدی', 
                    'dark fantasy': 'دارک فانتزی', 'horror': 'ترسناک'
                };
                const genreInFa = genreMap[selectedGenre] || selectedGenre;
                const hasGenre = item.genres && item.genres.some(g => normalizeText(g) === normalizeText(genreInFa) || normalizeText(g) === selectedGenre);
                if (!hasGenre) return; 
            }

            if (query !== "" && !shouldIgnoreQuery) {
                const titleFa = normalizeText(item.title_fa);
                const titleEn = normalizeText(item.title_en);
                const desc = normalizeText(item.description);

                if (titleFa === query || titleEn === query) score += 200;
                else if (titleFa.startsWith(query) || titleEn.startsWith(query)) score += 120;
                
                if (titleFa.includes(query)) score += 60;
                if (titleEn.includes(query)) score += 60;

                const queryWords = query.split(/\s+/).filter(w => w.length > 1);
                queryWords.forEach(word => {
                    if (["در", "به", "از", "با", "و", "یک", "the", "and", "of", "in", "a"].includes(word)) return;
                    if (titleFa.includes(word)) score += 20;
                    if (titleEn.includes(word)) score += 20;
                    if (desc && desc.includes(word)) score += 3; 
                });

                if (score === 0) return; 
            } else {
                score = 1; 
            }

            scoredItems.push({ item, score });
        });

        scoredItems.sort((a, b) => b.score - a.score);
        const finalResults = scoredItems.map(wrapper => wrapper.item);

        if (finalResults.length === 0) {
            showEmptyState();
        } else {
            renderResults(finalResults);
            showResultsState();
        }
    }

    function renderResults(items) {
        resultsGrid.innerHTML = '';
        items.forEach(item => {
            resultsGrid.insertAdjacentHTML(
                'beforeend',
                `
                <a href="https://manhwachi.ir/comic/${item.slug}" class="group block animate-fade-in">
                    <div class="aspect-[3/4] rounded-2xl overflow-hidden relative mb-2.5 shadow-lg glass-card group-hover:border-red-500/60 transition-all duration-300">
                        <img src="/manhwas/${item.slug}/${item.cover_image}" alt="${escapeHtml(item.title_en)}" loading="lazy" class="w-full h-full object-cover card-image-hover">
                        
                        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-80 group-hover:opacity-60 transition-opacity"></div>
                        
                        <div class="absolute top-2.5 right-2.5 bg-black/70 backdrop-blur-md text-[11px] font-bold px-2 py-0.5 rounded-lg text-white border border-white/10 flex items-center gap-1 shadow-md">
                            <span class="text-amber-400 text-xs">★</span> ${item.score || '4.8'}
                        </div>
                    </div>
                    <h3 class="font-bold text-xs sm:text-sm text-zinc-100 line-clamp-1 group-hover:text-red-500 transition-colors text-right" style="direction: rtl;">
                        ${escapeHtml(item.title_fa)}
                    </h3>
                    <p class="text-[11px] text-zinc-400 mt-0.5 text-right line-clamp-1">
                        ${item.genres ? item.genres.slice(0, 2).join(' • ') : ''}
                    </p>
                </a>
                `
            );
        });
    }

    function debounce(fn, delay = 250) {
        let timer;
        return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => fn(...args), delay);
        };
    }

    const debouncedSearch = debounce(performSearch, 200);

    // Event Listeners
    searchInput.addEventListener('input', debouncedSearch);
    typeFilter.addEventListener('change', performSearch);
    genreFilter.addEventListener('change', performSearch);

    searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addToHistory(searchInput.value);
    });

    clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        typeFilter.value = '';
        genreFilter.value = '';
        showDefaultState();
    });

    window.resetSearch = function() {
        searchInput.value = '';
        typeFilter.value = '';
        genreFilter.value = '';
        showDefaultState();
    };

    async function init() {
        await loadData();
        renderHistory();
    }

    init();
</script>
</body>
</html>
