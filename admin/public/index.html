<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>پنل مدیریت مانهواچی</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0c0d11;
    --panel:#15161d;
    --panel-2:#1b1d26;
    --border:#272935;
    --text:#eceef2;
    --muted:#8b8e9c;
    --accent:#f0a500;
    --accent-ink:#1a1200;
    --danger:#ef4444;
    --danger-bg:#2a1518;
    --ok:#22c55e;
    --ok-bg:#0f2419;
    --vip-bg:#3a2900;
    --radius:14px;
    --radius-sm:9px;
    --shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Vazirmatn", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0 0 90px;
    line-height: 1.6;
  }
  a { color: inherit; }

  /* ---------- هدر بالای صفحه ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(12,13,17,.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top));
  }
  .topbar h1 { font-size: 17px; margin: 0; font-weight: 800; }
  .topbar .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .wrap { max-width: 920px; margin: 0 auto; padding: 16px; }

  /* ---------- کارت‌های عمومی ---------- */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 14px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ---------- دکمه‌ها ---------- */
  button, .btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 40px;
    transition: transform .06s ease, background .15s ease, border-color .15s ease;
  }
  button:hover { background: #22242f; border-color: #3a3d4a; }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { background: var(--danger-bg); border-color: #5a2a2e; color: #ffb3b3; }
  button.danger:hover { background: #3a1b1f; }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.block { width: 100%; justify-content: center; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }

  /* ---------- فرم‌ها ---------- */
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  input, select, textarea {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 14px;
    width: 100%;
    font-family: inherit;
    min-height: 42px;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(240,165,0,.15);
  }
  textarea { min-height: 80px; resize: vertical; }
  .field { margin-bottom: 12px; }
  .checkbox-field { display: flex; align-items: center; gap: 8px; }
  .checkbox-field input { width: 18px; height: 18px; min-height: auto; flex: none; }
  .checkbox-field label { margin: 0; color: var(--text); font-weight: 500; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 640px) {
    .grid.cols-2 { grid-template-columns: 1fr 1fr; }
  }

  /* ---------- پیام‌ها ---------- */
  .msg {
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .msg.err { background: var(--danger-bg); color: #ffb0b0; }
  .msg.ok { background: var(--ok-bg); color: #a6f0c6; }

  /* ---------- بج وضعیت ---------- */
  .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .badge.vip { background: var(--vip-bg); color: var(--accent); }
  .badge.free { background: var(--ok-bg); color: #4ade80; }

  /* ---------- جستجو ---------- */
  .search-box { position: relative; margin-bottom: 14px; }
  .search-box input { padding-inline-start: 38px; }
  .search-box .icon {
    position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 15px; pointer-events: none;
  }

  /* ---------- جدول / لیست ریسپانسیو ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    color: var(--muted);
    font-weight: 600;
    text-align: right;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
  }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: none; }
  tbody td { padding: 10px; vertical-align: middle; }
  .title-cell { font-weight: 700; }
  .title-cell .en { display: block; color: var(--muted); font-size: 11px; font-weight: 400; margin-top: 2px; }
  .empty-row { text-align: center; color: var(--muted); padding: 24px 10px; }

  /* موبایل: جدول به کارت تبدیل می‌شه */
  @media (max-width: 680px) {
    table, thead, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tbody tr {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 10px;
    }
    tbody td {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 6px 2px;
      border: none;
      text-align: left;
    }
    tbody td::before {
      content: attr(data-label);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      flex: none;
    }
    tbody td.actions-cell { justify-content: flex-start; padding-top: 10px; }
    tbody td.actions-cell::before { display: none; }
    .empty-row { display: block; }
  }

  /* ---------- جزئیات چپترها ---------- */
  .ep-row-num { font-weight: 800; color: var(--accent); }

  details {
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  summary {
    cursor: pointer;
    color: #7ec8ff;
    font-size: 13px;
    padding: 12px 14px;
    font-weight: 600;
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; }
  details[open] summary::before { content: "▾ "; }
  details .inner { padding: 0 14px 14px; }

  .warn { color: var(--accent); }
  .missing { color: #ff8080; }
  .sync-ok { color: #4ade80; font-weight: 600; }

  #newFormPanel { display: none; }

  /* ---------- دکمه شناور افزودن (موبایل) ---------- */
  .fab {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom));
    left: 20px;
    z-index: 40;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    font-size: 26px;
    box-shadow: 0 10px 30px rgba(240,165,0,.4);
    display: none;
    align-items: center;
    justify-content: center;
  }
  @media (max-width: 680px) {
    .fab { display: flex; }
    .desktop-add-btn { display: none; }
  }

  .skeleton {
    color: var(--muted);
    text-align: center;
    padding: 20px;
    font-size: 13px;
  }

  .slug-tag { color: var(--muted); font-size: 12px; }
  .detail-title { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>🎛️ پنل مدیریت مانهواچی</h1>
    <div class="sub">مدیریت مانهواها و چپترها بدون دست زدن دستی به data.json</div>
  </div>

  <div class="wrap">
    <div id="globalMsg"></div>

    <div class="card">
      <h2>➕ مانهوای جدید</h2>
      <button class="primary desktop-add-btn" onclick="toggleNewForm()">+ افزودن مانهوای جدید</button>
      <div id="newFormPanel" style="margin-top:14px;">
        <div class="grid cols-2">
          <div class="field"><label>Slug (فقط انگلیسی و خط تیره)</label><input id="n_slug" placeholder="my-new-manhwa" /></div>
          <div class="field"><label>عنوان انگلیسی</label><input id="n_title_en" /></div>
          <div class="field"><label>عنوان فارسی</label><input id="n_title_fa" /></div>
          <div class="field"><label>منشا (کره‌ای/چینی/...)</label><input id="n_origin" value="کره ای" /></div>
          <div class="field"><label>نوع</label><input id="n_type" value="مانهوا" /></div>
          <div class="field"><label>ژانرها (با کاما جدا کن)</label><input id="n_genres" placeholder="اکشن, فانتزی" /></div>
          <div class="field"><label>امتیاز</label><input id="n_score" value="0.0" /></div>
          <div class="field"><label>تیم ترجمه</label><input id="n_scans_by" /></div>
          <div class="field"><label>نام فایل کاور</label><input id="n_cover" placeholder="cover.webp" /></div>
          <div class="field"><label>تاریخ پخش</label><input id="n_release_date" placeholder="۱۴۰۳/۰۵/۱۲" /></div>
        </div>
        <div class="field checkbox-field" style="margin-top:4px;">
          <input type="checkbox" id="n_vip" />
          <label for="n_vip">VIP باشد</label>
        </div>
        <div class="field"><label>توضیحات</label><textarea id="n_desc" rows="3"></textarea></div>
        <div class="btn-group" style="margin-top:6px;">
          <button class="primary" onclick="createManga()">ثبت مانهوا</button>
          <button class="ghost" onclick="toggleNewForm()">انصراف</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>📚 لیست مانهواها</h2>
      <div class="search-box">
        <span class="icon">🔍</span>
        <input id="searchInput" placeholder="جستجو بر اساس عنوان یا slug..." oninput="renderList()" />
      </div>
      <table>
        <thead>
          <tr><th>عنوان</th><th>وضعیت</th><th>چپترها</th><th>آخرین</th><th></th></tr>
        </thead>
        <tbody id="mangaList"><tr><td class="skeleton" colspan="5">در حال بارگذاری...</td></tr></tbody>
      </table>
    </div>

    <div id="detailArea"></div>
  </div>

  <button class="fab" onclick="toggleNewForm(); window.scrollTo({top:0, behavior:'smooth'});" aria-label="افزودن مانهوای جدید">+</button>

<script>
const $ = (id) => document.getElementById(id);
let fullMangaList = [];

function showMsg(target, text, ok) {
  target.innerHTML = `<div class="msg ${ok ? 'ok' : 'err'}">${text}</div>`;
  setTimeout(() => { target.innerHTML = ''; }, 5000);
}

async function api(url, opts) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'خطای ناشناخته');
  return data;
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function toggleNewForm() {
  const f = $('newFormPanel');
  f.style.display = f.style.display === 'none' || !f.style.display ? 'block' : 'none';
}

async function createManga() {
  try {
    await api('/admin/api/manga', {
      method: 'POST',
      body: JSON.stringify({
        slug: $('n_slug').value.trim(),
        title_en: $('n_title_en').value.trim(),
        title_fa: $('n_title_fa').value.trim(),
        origin: $('n_origin').value.trim(),
        type: $('n_type').value.trim(),
        genres: $('n_genres').value,
        score: $('n_score').value.trim(),
        scans_by: $('n_scans_by').value.trim(),
        cover_image: $('n_cover').value.trim(),
        release_date: $('n_release_date').value.trim(),
        is_vip: $('n_vip').checked,
        description: $('n_desc').value.trim(),
      }),
    });
    showMsg($('globalMsg'), 'مانهوا با موفقیت اضافه شد.', true);
    toggleNewForm();
    loadList();
  } catch (err) {
    showMsg($('globalMsg'), err.message, false);
  }
}

async function loadList() {
  fullMangaList = await api('/admin/api/manga');
  renderList();
}

function renderList() {
  const q = ($('searchInput')?.value || '').trim().toLowerCase();
  const list = !q
    ? fullMangaList
    : fullMangaList.filter(m =>
        (m.title_fa || '').toLowerCase().includes(q) ||
        (m.title_en || '').toLowerCase().includes(q) ||
        (m.slug || '').toLowerCase().includes(q)
      );

  const tbody = $('mangaList');
  if (!fullMangaList.length) {
    tbody.innerHTML = '<tr><td class="empty-row" colspan="5">هنوز مانهوایی ثبت نشده.</td></tr>';
    return;
  }
  if (!list.length) {
    tbody.innerHTML = '<tr><td class="empty-row" colspan="5">چیزی با این جستجو پیدا نشد.</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(m => `
    <tr>
      <td data-label="عنوان">
        <span class="title-cell">
          ${escapeHtml(m.title_fa || m.title_en)}
          <span class="en">${escapeHtml(m.slug)}</span>
        </span>
      </td>
      <td data-label="وضعیت">${m.is_vip ? '<span class="badge vip">VIP</span>' : '<span class="badge free">رایگان</span>'}</td>
      <td data-label="چپترها">${m.episodeCount}</td>
      <td data-label="آخرین چپتر">${m.lastEpisode ?? '-'}</td>
      <td class="actions-cell" data-label="">
        <div class="btn-group">
          <button onclick="openDetail('${m.slug}')">⚙️ مدیریت</button>
          <button class="danger" onclick="deleteManga('${m.slug}')">🗑️ حذف</button>
        </div>
      </td>
    </tr>
  `).join('');
}

async function deleteManga(slug) {
  if (!confirm(`مطمئنی می‌خوای «${slug}» رو کامل حذف کنی؟`)) return;
  try {
    await api('/admin/api/manga/' + encodeURIComponent(slug), { method: 'DELETE' });
    showMsg($('globalMsg'), 'حذف شد.', true);
    $('detailArea').innerHTML = '';
    loadList();
  } catch (err) {
    showMsg($('globalMsg'), err.message, false);
  }
}

async function openDetail(slug) {
  const m = await api('/admin/api/manga/' + encodeURIComponent(slug));
  const episodesRows = (m.episodes || []).sort((a,b) => b.num - a.num).map(ep => `
    <tr>
      <td data-label="شماره"><span class="ep-row-num">#${ep.num}</span></td>
      <td data-label="تاریخ"><input value="${escapeHtml(ep.date || '')}" onchange="editEpisode('${slug}', ${ep.num}, {date: this.value})" /></td>
      <td data-label="وضعیت">
        <select onchange="editEpisode('${slug}', ${ep.num}, {free: this.value === 'true'})">
          <option value="true" ${ep.free ? 'selected' : ''}>رایگان</option>
          <option value="false" ${!ep.free ? 'selected' : ''}>VIP</option>
        </select>
      </td>
      <td class="actions-cell" data-label=""><button class="danger" onclick="deleteEpisode('${slug}', ${ep.num})">🗑️ حذف</button></td>
    </tr>
  `).join('');

  $('detailArea').innerHTML = `
    <div class="card">
      <div class="detail-title">
        <h2 style="margin-bottom:0;">🛠️ مدیریت: ${escapeHtml(m.title_fa || m.title_en)}</h2>
        <span class="slug-tag">${escapeHtml(slug)}</span>
      </div>
      <div id="detailMsg" style="margin-top:10px;"></div>

      <div class="btn-group" style="margin:14px 0 6px;">
        <button class="primary" onclick="quickAddEpisode('${slug}')">➕ افزودن چپتر جدید (خودکار)</button>
        <button onclick="checkSync('${slug}')">🔄 بررسی همگام‌سازی با S3</button>
      </div>
      <div id="syncResult"></div>

      <table style="margin-top:10px;">
        <thead><tr><th>شماره</th><th>تاریخ</th><th>وضعیت</th><th></th></tr></thead>
        <tbody>${episodesRows || '<tr><td class="empty-row" colspan="4">هنوز چپتری ثبت نشده.</td></tr>'}</tbody>
      </table>

      <details>
        <summary>افزودن چپتر با شماره و تاریخ دلخواه</summary>
        <div class="inner">
          <div class="grid cols-2">
            <div class="field"><label>شماره چپتر</label><input id="e_num_${slug}" type="number" /></div>
            <div class="field"><label>تاریخ (شمسی، خالی = امروز)</label><input id="e_date_${slug}" placeholder="1405/06/15" /></div>
          </div>
          <div class="field checkbox-field">
            <input type="checkbox" id="e_free_${slug}" checked />
            <label for="e_free_${slug}">رایگان</label>
          </div>
          <button class="primary" onclick="manualAddEpisode('${slug}')">افزودن</button>
        </div>
      </details>

      <details style="margin-top:12px;">
        <summary>ویرایش اطلاعات مانهوا</summary>
        <div class="inner">
          <div class="grid cols-2">
            <div class="field"><label>عنوان فارسی</label><input id="m_title_fa" value="${escapeHtml(m.title_fa || '')}" /></div>
            <div class="field"><label>عنوان انگلیسی</label><input id="m_title_en" value="${escapeHtml(m.title_en || '')}" /></div>
            <div class="field"><label>ژانرها</label><input id="m_genres" value="${escapeHtml((m.genres || []).join(', '))}" /></div>
            <div class="field"><label>امتیاز</label><input id="m_score" value="${escapeHtml(m.score || '')}" /></div>
            <div class="field"><label>تیم ترجمه</label><input id="m_scans_by" value="${escapeHtml(m.scans_by || '')}" /></div>
            <div class="field"><label>تاریخ پخش</label><input id="m_release_date" value="${escapeHtml(m.release_date || '')}" placeholder="۱۴۰۳/۰۵/۱۲" /></div>
          </div>
          <div class="field checkbox-field">
            <input type="checkbox" id="m_vip" ${m.is_vip ? 'checked' : ''} />
            <label for="m_vip">VIP باشد</label>
          </div>
          <div class="field"><label>توضیحات</label><textarea id="m_desc" rows="3">${escapeHtml(m.description || '')}</textarea></div>
          <button class="primary" onclick="saveMangaEdit('${slug}')">ذخیره تغییرات</button>
        </div>
      </details>
    </div>
  `;
}

async function quickAddEpisode(slug) {
  try {
    const r = await api(`/admin/api/manga/${encodeURIComponent(slug)}/episodes`, {
      method: 'POST', body: JSON.stringify({}),
    });
    showMsg($('detailMsg'), `چپتر ${r.num} اضافه شد.`, true);
    openDetail(slug);
    loadList();
  } catch (err) { showMsg($('detailMsg'), err.message, false); }
}

async function manualAddEpisode(slug) {
  try {
    const num = $(`e_num_${slug}`).value;
    const date = $(`e_date_${slug}`).value;
    const free = $(`e_free_${slug}`).checked;
    await api(`/admin/api/manga/${encodeURIComponent(slug)}/episodes`, {
      method: 'POST', body: JSON.stringify({ num: num || undefined, date: date || undefined, free }),
    });
    showMsg($('detailMsg'), 'چپتر اضافه شد.', true);
    openDetail(slug);
    loadList();
  } catch (err) { showMsg($('detailMsg'), err.message, false); }
}

async function editEpisode(slug, num, patch) {
  try {
    await api(`/admin/api/manga/${encodeURIComponent(slug)}/episodes/${num}`, {
      method: 'PUT', body: JSON.stringify(patch),
    });
  } catch (err) { alert(err.message); }
}

async function deleteEpisode(slug, num) {
  if (!confirm(`چپتر ${num} حذف شود؟`)) return;
  try {
    await api(`/admin/api/manga/${encodeURIComponent(slug)}/episodes/${num}`, { method: 'DELETE' });
    openDetail(slug);
    loadList();
  } catch (err) { alert(err.message); }
}

async function saveMangaEdit(slug) {
  try {
    await api('/admin/api/manga/' + encodeURIComponent(slug), {
      method: 'PUT',
      body: JSON.stringify({
        title_fa: $('m_title_fa').value,
        title_en: $('m_title_en').value,
        genres: $('m_genres').value,
        score: $('m_score').value,
        scans_by: $('m_scans_by').value,
        release_date: $('m_release_date').value,
        is_vip: $('m_vip').checked,
        description: $('m_desc').value,
      }),
    });
    showMsg($('detailMsg'), 'ذخیره شد.', true);
    loadList();
  } catch (err) { showMsg($('detailMsg'), err.message, false); }
}

async function checkSync(slug) {
  const box = $('syncResult');
  box.innerHTML = '<div class="skeleton">در حال بررسی...</div>';
  try {
    const r = await api(`/admin/api/sync-check/${encodeURIComponent(slug)}`);
    let html = '<div class="card" style="margin-top:10px;">';
    if (r.missingInJson.length) {
      html += `<div class="missing">این چپترها روی S3 آپلود شدن ولی تو JSON ثبت نشدن: ${r.missingInJson.join(', ')}</div>`;
      html += `<div class="btn-group" style="margin-top:8px;">` +
        r.missingInJson.map(n => `<button onclick="addSpecificEpisode('${slug}', ${n})">+ افزودن چپتر ${n}</button>`).join(' ') +
        `</div>`;
    } else {
      html += '<div class="sync-ok">همه‌ی چپترهای آپلودشده تو JSON هم ثبت شدن ✓</div>';
    }
    if (r.missingInS3.length) {
      html += `<div class="warn" style="margin-top:8px;">این چپترها تو JSON هستن ولی هنوز عکسی روی S3 براشون پیدا نشد: ${r.missingInS3.join(', ')}</div>`;
    }
    html += '</div>';
    box.innerHTML = html;
  } catch (err) {
    box.innerHTML = `<div class="msg err">${err.message}</div>`;
  }
}

async function addSpecificEpisode(slug, num) {
  try {
    await api(`/admin/api/manga/${encodeURIComponent(slug)}/episodes`, {
      method: 'POST', body: JSON.stringify({ num, free: true }),
    });
    openDetail(slug);
    loadList();
    checkSync(slug);
  } catch (err) { alert(err.message); }
}

loadList();
</script>
